<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Global
        var fname="Ambikaa";
        var fname="Sachitanand";//redeclare
        fname="Tanushree"; //reassign Allowed
        document.write(fname + "<br>");
    </script>

    <script>
        // Block Scope
        let lname ="Sachitanand";
        lname ="Ambulgekar";    //reassign allowed
        document.write(lname + "<br>");
    </script>

    <script>
        //Block Scope
        const c_name = "Deloitee";
         c_name = "Infosys";

        document.write(c_name + "<br>");
    </script>
</body>
</html>
