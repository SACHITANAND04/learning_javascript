<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- ARTHMATIC OPERATORS -->
    <script>
        var a = 10;
        var b = 4;
        var c = a - b; //binary
        document.write(c + "<br>");
        c++; //unary
        c++;
        c++;
        c--;
        c++;
        c--;
        c++;   //17
        document.write(c + "<br>");
        </script>


         <!-- ASSIGNMENT OPERATORS =, +=, -+, *= -->

        <script>
            var x = 10;
            var y = 12;
            x += y;
            document.write(x + "<br>"); //22 
            document.write(y); 

        </script>

        <!-- COMPARISON OPERATORS <,>,<=,>=,==,=== -->

        <script>
            var p = "17";
            var q = 17;

            document.write("<br>");
            if (p==q){
                document.write("true  <br>");
            }else{
                document.write("false");
            }
        </script> 

        <!-- logical operators && , || , ! -->

        <script>
            var age = 17;
            if(age >= 18 && age <=100){
              document.write("Eligible For Vote") ; 
            }else{
                document.write("Not Eligibal");
            }
        </script>
        
        <script>

            document.write(eligibility);
