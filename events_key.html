<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
   <!-- onresize , onkeypress , onscroll , oncontextmenu right click hothch nahii-->
<body oncontextmenu="return false;">
    <button onclick="hello()">Single click</button>
    <button onclick="hello()">Double  click</button>
    <button oncontextenter="hello()">right click</button>
    <button onmouseenter="hello()">Mouse Enter click</button>
    <button onmouseout="hello()">Mouse Out click</button>

    <script>
        function hello(){
            alert("Hello Ambikaa🧿");
        }
    </script>
</body>
</html>
